name: GPU numerical validation (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Isolate package installation
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/colortransfer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "$RUNNER_TEMP/colortransfer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/bin" >> "$GITHUB_PATH"
      - run: python -m pip install pytest numpy Pillow matplotlib 'torch>=2.6' 'triton>=3.2'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Require a real NVIDIA GPU runtime
        run: |
          python - <<'PY'
          import torch, triton, colortransfer_triton
          assert torch.cuda.is_available(), 'GPU tests must not silently skip'
          assert torch.version.hip is None, 'NVIDIA CUDA is required'
          print(torch.cuda.get_device_name(), torch.__version__, triton.__version__)
          print(colortransfer_triton.__file__)
          PY
      - run: python -m pytest -q tests
      - run: python benchmarks/benchmark.py --check-only --torch-reference
      - run: python benchmarks/benchmark.py --colorfm --colorfm-steps 20 --check-only

