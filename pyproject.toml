[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "colortransfer-triton"
version = "0.1.0"
description = "GPU color transfer without pretrained weights: AdaIN, wavelet, OT and ColorFM-O"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["torch>=2.6", "triton>=3.2"]

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.24", "Pillow>=10"]
figures = ["numpy>=1.24", "Pillow>=10", "matplotlib>=3.8"]
dev = ["pytest>=8", "numpy>=1.24", "Pillow>=10", "ruff>=0.11", "build>=1.2", "twine>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
